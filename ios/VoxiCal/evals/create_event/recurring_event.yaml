suite: Create Event — Recurring Events
description: >
  Scenarios involving recurring event creation. The agent must correctly
  identify the recurrence intent, apply event-type defaults (all-day for
  birthdays), and ask for clarification when recurrence end dates or term
  boundaries are unspecified before committing.

scenarios:

  # ── BIRTHDAY — ALL-DAY (ALWAYS RECURRING ANNUALLY) ───────────────────

  - id: cre-rec-001
    name: Birthday always created as all-day event
    event_type: birthday
    user: "Add Maya's birthday on September 3"
    seed_events: []
    expected:
      workflow: createCalendarEvent
      isAllDay: true
    graders:
      - createToolCalledGrader
      - createCalledWithAllDayGrader
      - responseContainsAny([added, created, birthday, Maya, september])

  - id: cre-rec-002
    name: Birthday ignores user-stated time — creates all-day
    event_type: birthday
    user: "Add my friend's birthday on December 5 at noon"
    notes: >
      Even if the user says "at noon", birthdays must always be created
      as all-day events. The time must be silently ignored.
    expected:
      workflow: createCalendarEvent
      isAllDay: true
    graders:
      - createToolCalledGrader
      - createCalledWithAllDayGrader

  # ── GYM — RECURRING ───────────────────────────────────────────────────

  - id: cre-rec-010
    name: Recurring gym session without end date — agent asks for clarification
    event_type: gym_session
    user: "Schedule a gym session every Monday at 6am for 1 hour"
    notes: >
      No end date provided. Agent should either ask "how long would you like
      this to repeat?" or create the first occurrence and acknowledge the
      recurring intent. Silently ignoring the recurrence is a failure.
    expected:
      workflow: ask_for_end_date OR create_first_occurrence_and_acknowledge
    graders:
      - responseContainsAny([how long, how many weeks, end date, when, until,
          series, recurring, every week, created, scheduled, added, set up])

  - id: cre-rec-011
    name: Recurring gym session with end date — agent proceeds
    event_type: gym_session
    user: "Schedule a gym session every Monday at 6am for 1 hour through the end of June"
    expected:
      workflow: createCalendarEvent or acknowledge_recurring
    graders:
      - responseContainsAny([created, scheduled, added, gym, monday,
          set up, recurring, every monday, june])

  # ── CLASS — RECURRING WITH ACADEMIC TERM ─────────────────────────────

  - id: cre-rec-020
    name: Class recurring without term dates — agent asks for start/end of term
    event_type: class
    user: "Add my economics lecture every Tuesday and Thursday at 11am for 50 minutes"
    notes: >
      No academic term specified. Agent should ask when the term starts and ends,
      OR acknowledge and ask for clarification before committing.
      Acceptable terms: August–December (fall) or January–April (spring).
    expected:
      workflow: ask_for_term_dates OR create_and_acknowledge
    graders:
      - responseContainsAny([start, end, when, until, how long, semester,
          term, august, december, january, april, created, scheduled, set up, recurring])

  - id: cre-rec-021
    name: Class with fall term specified (Aug–Dec) — agent proceeds
    event_type: class
    user: "Add my stats class every Wednesday at 2pm for 1 hour from August through December"
    expected:
      workflow: createCalendarEvent or acknowledge_recurring
    graders:
      - responseContainsAny([created, scheduled, added, stats, wednesday,
          august, december, set up, class])

  - id: cre-rec-022
    name: Class with spring term specified (Jan–Apr) — agent proceeds
    event_type: class
    user: "Schedule my calculus lecture every Monday and Wednesday at 10am for 75 minutes from January to April"
    expected:
      workflow: createCalendarEvent or acknowledge_recurring
    graders:
      - responseContainsAny([created, scheduled, added, calculus, monday,
          january, april, set up, class])

  # ── RECURRING PROFESSIONAL ────────────────────────────────────────────

  - id: cre-rec-030
    name: Weekly meeting with all details — agent creates and confirms
    event_type: professional
    user: "Schedule a weekly team standup every Monday at 9am for 15 minutes on Zoom"
    notes: >
      All required fields are present including location. Agent should proceed.
    expected:
      workflow: createCalendarEvent or acknowledge_recurring
    graders:
      - responseContainsAny([created, scheduled, added, standup, monday,
          9, zoom, weekly, every monday])
