suite: Create Event — Happy Path
description: >
  Scenarios where the user provides all required information upfront.
  The agent should call createCalendarEvent immediately without asking
  clarifying questions. Each scenario verifies the correct workflow is
  chosen and that the tool payload matches the event-type rules.

scenarios:

  # ── PROFESSIONAL EVENTS ──────────────────────────────────────────────

  - id: cre-hap-001
    name: Manager 1:1 with all required details
    event_type: professional
    user: "Schedule a 1:1 with my manager tomorrow at 10am for 45 minutes on Zoom"
    seed_events: []
    required_fields: [title, date, time, duration, location]
    expected:
      workflow: createCalendarEvent
      isAllDay: false
    graders:
      - createToolCalledGrader
      - createCalledWithoutAllDayGrader
      - responseContainsAny([scheduled, created, added, 1:1, manager, zoom])

  - id: cre-hap-002
    name: Team meeting with all details provided
    event_type: professional
    user: "Add a team sync the day after tomorrow at 2pm for 30 minutes on Teams"
    seed_events: []
    required_fields: [title, date, time, duration, location]
    expected:
      workflow: createCalendarEvent
      isAllDay: false
    graders:
      - createToolCalledGrader
      - createCalledWithoutAllDayGrader

  - id: cre-hap-003
    name: Interview with all details
    event_type: professional
    user: "Add an interview with Acme Corp next Monday at 11am for 1 hour at their San Francisco office"
    seed_events: []
    required_fields: [title, date, time, duration, location]
    expected:
      workflow: createCalendarEvent
    graders:
      - createToolCalledGrader

  # ── STUDY SESSIONS ───────────────────────────────────────────────────

  - id: cre-hap-010
    name: Study session — location NOT required
    event_type: study_session
    user: "Schedule a study session tomorrow at 2pm for 2 hours"
    seed_events: []
    required_fields: [title, date, time, duration]
    optional_fields: []
    expected:
      workflow: createCalendarEvent
      durationMinutes: 120
      isAllDay: false
    graders:
      - createToolCalledGrader
      - createCalledWithDurationGrader(120)
      - createCalledWithoutAllDayGrader

  - id: cre-hap-011
    name: Study session resolves missing time in second turn
    event_type: study_session
    turns:
      - user: "Add a chemistry study session tomorrow for 90 minutes"
        expected: ask_for_time
        graders:
          - noActionToolCallsThisTurnGrader
          - createPromptAskForDateTimeGrader
      - user: "At 3pm"
        expected: createCalendarEvent
        graders:
          - createToolCalledGrader
          - createCalledWithDurationGrader(90)

  # ── GYM SESSIONS ─────────────────────────────────────────────────────

  - id: cre-hap-020
    name: Gym session — location NOT required unless provided
    event_type: gym_session
    user: "Add a gym session tomorrow at 6am for 1 hour"
    seed_events: []
    required_fields: [title, date, time, duration]
    optional_fields: [location]
    expected:
      workflow: createCalendarEvent
      durationMinutes: 60
      isAllDay: false
    graders:
      - createToolCalledGrader
      - createCalledWithDurationGrader(60)

  - id: cre-hap-021
    name: Gym session with user-provided gym name
    event_type: gym_session
    user: "Schedule a workout at Equinox this Friday at 7am for 45 minutes"
    seed_events: []
    expected:
      workflow: createCalendarEvent
      durationMinutes: 45
      location: Equinox
    graders:
      - createToolCalledGrader
      - createCalledWithDurationGrader(45)

  # ── CLASSES ──────────────────────────────────────────────────────────

  - id: cre-hap-030
    name: Class — classroom NOT required
    event_type: class
    user: "Add my biology lecture tomorrow at 9am for 1 hour 30 minutes"
    seed_events: []
    required_fields: [title, date, time, duration]
    optional_fields: [location]
    expected:
      workflow: createCalendarEvent
      durationMinutes: 90
    graders:
      - createToolCalledGrader
      - createCalledWithDurationGrader(90)

  - id: cre-hap-031
    name: Class with classroom specified
    event_type: class
    user: "Add my physics lecture on Monday at 10am for 50 minutes in Room 204"
    seed_events: []
    expected:
      workflow: createCalendarEvent
      durationMinutes: 50
      location: Room 204
    graders:
      - createToolCalledGrader
      - createCalledWithDurationGrader(50)

  # ── SOCIAL EVENTS ────────────────────────────────────────────────────

  - id: cre-hap-040
    name: Family dinner — duration NOT required
    event_type: social
    user: "Add a family dinner this Sunday at 7pm"
    seed_events: []
    required_fields: [title, date, time]
    optional_fields: [location]
    expected:
      workflow: createCalendarEvent
      isAllDay: false
    negative_assertions:
      - must NOT ask for duration
    graders:
      - createToolCalledGrader
      - didNotAskForDurationGrader

  - id: cre-hap-041
    name: Date night with optional location
    event_type: social
    user: "Add a date night this Saturday at 8pm at Nobu"
    seed_events: []
    expected:
      workflow: createCalendarEvent
      location: Nobu
    graders:
      - createToolCalledGrader

  # ── MOVIES ───────────────────────────────────────────────────────────

  - id: cre-hap-050
    name: Movie — default 150 min duration applied
    event_type: movie
    user: "Add a movie night tomorrow at 8pm"
    seed_events: []
    required_fields: [title, date, time]
    defaults:
      durationMinutes: 150
    expected:
      workflow: createCalendarEvent
      durationMinutes: 150
      isAllDay: false
    negative_assertions:
      - must NOT ask user for duration
    graders:
      - createToolCalledGrader
      - createCalledWithDurationGrader(150)
      - didNotAskForDurationGrader

  - id: cre-hap-051
    name: Movie — user-provided duration overrides default
    event_type: movie
    user: "Add a movie this Friday at 7pm, it's 3 hours long"
    seed_events: []
    expected:
      workflow: createCalendarEvent
      durationMinutes: 180
    graders:
      - createToolCalledGrader
      - createCalledWithDurationGrader(180)

  - id: cre-hap-052
    name: Movie with theater specified
    event_type: movie
    user: "Add a movie at AMC next Saturday at 6pm"
    seed_events: []
    expected:
      workflow: createCalendarEvent
      durationMinutes: 150
      location: AMC
    graders:
      - createToolCalledGrader
      - createCalledWithDurationGrader(150)

  # ── BIRTHDAYS ────────────────────────────────────────────────────────

  - id: cre-hap-060
    name: Birthday — all-day event, date only required
    event_type: birthday
    user: "Add my mom's birthday on June 20"
    seed_events: []
    required_fields: [title, date]
    expected:
      workflow: createCalendarEvent
      isAllDay: true
    negative_assertions:
      - must NOT ask for time
      - must NOT ask for duration
      - must NOT ask for location
    graders:
      - createToolCalledGrader
      - createCalledWithAllDayGrader

  - id: cre-hap-061
    name: Birthday — creates immediately without asking for time or duration
    event_type: birthday
    user: "Add Alex's birthday on July 4th"
    seed_events: []
    expected:
      workflow: createCalendarEvent
      isAllDay: true
    graders:
      - createToolCalledGrader
      - createCalledWithAllDayGrader
